name: release-please

# On every push to main, release-please analyzes conventional commits since the
# last release. If a version bump is warranted (feat = minor, fix = patch,
# ! = major), it creates or updates a "Release PR" that auto-merges.
#
# When the Release PR merges, this workflow runs again. release-please creates
# the git tag + GitHub Release, then the publish job builds and publishes to
# PyPI via OIDC trusted publishing (no API token).
#
# PyPI trusted publisher must be configured with:
#   workflow = release-please.yml, environment = pypi
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv build

      - uses: pypa/gh-action-pypi-publish@release/v1
